[project]
name = "orbi"
version = "0.1.0"
description = "Daemon for Orbi, the desk sphere"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "cryptography",
    "qrcode",
    "faster-whisper",
    "numpy",
    "pynput",
    "pywebview",
    "markdown",
    "mcp>=2.3",
    "Pillow",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
orbi = "orbi.cli:main"

[tool.setuptools]
package-dir = { "" = "daemon" }
packages = ["orbi"]

[tool.setuptools.package-data]
orbi = ["panel.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project]
name = "orbi"
version = "0.1.0"
description = "Daemon for Orbi, the desk sphere"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "cryptography",
    "qrcode",
    "faster-whisper",
    "numpy",
    "pynput",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
orbi = "orbi.cli:main"

[tool.setuptools]
package-dir = { "" = "daemon" }
packages = ["orbi"]

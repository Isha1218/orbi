<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e6e6ea;
    -webkit-font-smoothing: antialiased;
  }
  #stack { padding: 12px 16px 28px; }
  .card {
    background: rgba(14, 14, 17, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 24px rgba(255, 255, 255, 0.04);
    animation: slide-in 0.28s ease-out;
  }
  .hidden { display: none; }
  @keyframes slide-in {
    from { transform: translate(40px, -12px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }

  #toast {
    width: fit-content;
    max-width: 100%;
    box-sizing: border-box;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    color: #cfcfd6;
  }
  #toast.hidden { display: none; }
  .orb {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.6);
  }

  #panel { position: relative; padding: 16px 18px; }
  #close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #8a8a94;
    font-size: 16px;
    line-height: 24px;
    cursor: pointer;
  }
  #close:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  h1 { margin: 0 28px 10px 0; font-size: 15px; font-weight: 600; color: #fff; }
  .body { max-height: MAX_HEIGHTpx; overflow-y: auto; }
  .body > :first-child { margin-top: 0; }
  .body > :last-child { margin-bottom: 0; }
  p, ul, ol { margin: 0 0 10px; }
  ul, ol { padding-left: 20px; }
  strong { color: #fff; }
  a { color: #b9c8ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; border-radius: 8px; }
  code { font: 12.5px/1.5 "SF Mono", Menlo, monospace; }
  :not(pre) > code {
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
  }
  pre {
    margin: 0 0 10px;
    padding: 10px 12px;
    background: #08080a;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    overflow-x: auto;
    color: #dcdce4;
  }
  table { border-collapse: collapse; margin: 0 0 10px; font-size: 13px; }
  th, td { padding: 5px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left; }
  th { color: #fff; font-weight: 600; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button {
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: #f2f2f5;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .actions button:hover { background: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>
<div id="stack">
  <div id="toast" class="card hidden"><span class="orb"></span><span id="toast-text"></span></div>
  <div id="panel" class="card hidden">
    <button id="close" title="Close">&times;</button>
    <div id="panel-content"></div>
  </div>
</div>
<script>
  const toast = document.getElementById("toast");
  const panel = document.getElementById("panel");
  let toastTimer = null;

  function fit() {
    const empty = toast.classList.contains("hidden") && panel.classList.contains("hidden");
    if (empty) {
      pywebview.api.fit(0);
    } else {
      pywebview.api.fit(document.getElementById("stack").offsetHeight);
    }
  }

  // Re-adding the element restarts its slide-in animation
  function reveal(el) {
    el.classList.add("hidden");
    void el.offsetWidth;
    el.classList.remove("hidden");
  }

  function showToast(text) {
    document.getElementById("toast-text").textContent = "“" + text + "”";
    reveal(toast);
    fit();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.add("hidden");
      fit();
    }, 4000);
  }

  function showPanel(html) {
    document.getElementById("panel-content").innerHTML = html;
    reveal(panel);
    fit();
  }

  document.getElementById("close").onclick = function () {
    panel.classList.add("hidden");
    fit();
  };

  // Links and action buttons open in the default browser, never inside the panel
  document.addEventListener("click", function (event) {
    const link = event.target.closest("a[href], button[data-url]");
    if (!link) {
      return;
    }
    event.preventDefault();
    pywebview.api.open(link.getAttribute("href") || link.dataset.url);
  });

  // Images load after the panel is shown, so refit when they do
  document.addEventListener("load", fit, true);
</script>
</body>
</html>
